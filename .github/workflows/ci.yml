name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway database that only exists for this job.
          POSTGRES_USER: avalon
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: avalon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avalon -d avalon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://avalon:ci-only@localhost:5432/avalon_test
      # Storage tests must run against PostgreSQL here, never skip.
      REQUIRE_POSTGRES_TESTS: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting of the rules engine, storage, agents and evals
        run: ruff format --check app/game tests/game app/storage tests/storage migrations app/agents tests/agents app/gm tests/gm app/evals tests/evals app/observability.py tests/test_observability.py
      - name: Test with branch coverage
        run: pytest --cov --cov-fail-under=75
      - name: Rules engine keeps at least 90% branch coverage
        run: coverage report --include="app/game/*" --fail-under=90
      - name: Evaluation harness holds its invariants against a misbehaving model
        run: python -m app.evals.run --provider hostile --random-games 20 --model-games 1 --players 5

  web:
    name: Web (typecheck, vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  compose:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack and wait until every service is healthy
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: The web origin reaches the API through the proxy
        run: |
          status="$(curl --fail --silent --show-error http://127.0.0.1:5173/api/health | jq -r .status)"
          test "$status" = "ok"
      - name: A game survives an API restart
        run: |
          room="$(curl --fail --silent --show-error -X POST http://127.0.0.1:5173/api/rooms -H 'Content-Type: application/json' -d '{"nickname":"ci","player_count":5}')"
          game_id="$(jq -r .game_id <<<"$room")"
          token="$(jq -r .token <<<"$room")"
          curl --fail --silent --show-error -X POST "http://127.0.0.1:5173/api/games/$game_id/actions" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"type":"start_game"}' > before.json
          docker compose restart api
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent --show-error "http://127.0.0.1:5173/api/games/$game_id" -H "Authorization: Bearer $token" > after.json
          test "$(jq -r .phase after.json)" != "lobby"
          diff <(jq -S . before.json) <(jq -S . after.json)
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
